name: pull-sleeper

on:
  schedule:
    # UTC. 07:05 = after every US game (2:05am Eastern, 5:05pm Brisbane) -> feeds the daily digest.
    # 21:05 = 4:05pm Eastern, after injury reports -> feeds the 7:30am Brisbane briefs.
    # 01:05 and 13:05 keep the snapshot fresh in between.
    - cron: '5 1,7,13,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Sleeper snapshot
        env:
          LEAGUE_ID: '1352074497095655424'
          MY_ROSTER_ID: '7'
        run: python fetch.py
      - name: Run engine
        # The maths runs here, on GitHub's runner, not in the scheduled Claude session (which only
        # reads JSON). A failed mode removes its stale report so the session falls back to a manual read.
        run: |
          python engine.py --mode daily  --params params.json --out data/report_daily.json  > /dev/null || rm -f data/report_daily.json
          python engine.py --mode weekly --params params.json --out data/report_weekly.json > /dev/null || rm -f data/report_weekly.json
      - name: Commit snapshot and reports
        run: |
          git config user.name "packadarts-bot"
          git config user.email "packadarts-bot@users.noreply.github.com"
          git add data
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin main
          git push
